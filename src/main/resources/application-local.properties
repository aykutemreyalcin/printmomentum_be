spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/printmomentum?tinyInt1isBit=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:printmomentum}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:printmomentum}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

printmomentum.ingest.enabled=true
printmomentum.ingest.cron=0 0 0,6,12,18 * * *
printmomentum.ingest.limit=25
spring.config.import=optional:classpath:printmomentum/ingest-local.yml

printmomentum.bestseller.site-search.enabled=true

printmomentum.storage.s3.enabled=${PRINTMOMENTUM_STORAGE_S3_ENABLED:false}
printmomentum.auth.additional-keys=${PRINTMOMENTUM_API_KEY:dev-local-printmomentum}
