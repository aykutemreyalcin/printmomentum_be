spring.application.name=printmomentum-be
server.port=8080

spring.datasource.url=jdbc:h2:mem:printmomentum;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

spring.cache.type=caffeine
spring.cache.cache-names=etsyTaxonomy
spring.cache.caffeine.spec=expireAfterWrite=24h,maximumSize=16

printmomentum.cors.allowed-origins=http://localhost:5173

jwt.secret=${JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
jwt.expiration=${JWT_EXPIRATION:259200000}

auth.v2.access-token-expiration-ms=${AUTH_V2_ACCESS_TOKEN_EXPIRATION_MS:7200000}
auth.v2.refresh-token-expiration-ms=${AUTH_V2_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
auth.v2.refresh-cookie-name=${AUTH_V2_REFRESH_COOKIE_NAME:printmomentum_refresh_token}
auth.v2.refresh-cookie-secure=${AUTH_V2_REFRESH_COOKIE_SECURE:false}
auth.v2.refresh-cookie-same-site=${AUTH_V2_REFRESH_COOKIE_SAME_SITE:Lax}
auth.v2.refresh-cookie-path=${AUTH_V2_REFRESH_COOKIE_PATH:/}
auth.v2.refresh-cookie-domain=${AUTH_V2_REFRESH_COOKIE_DOMAIN:}

printmomentum.etsy.api-key=${ETSY_API_KEY:}
printmomentum.etsy.base-url=https://openapi.etsy.com/v3/application
printmomentum.etsy.connect-timeout=5s
printmomentum.etsy.read-timeout=15s
printmomentum.etsy.max-retries=3
printmomentum.etsy.retry-backoff=200ms
printmomentum.etsy.max-requests-per-second=8

spring.config.import=optional:classpath:printmomentum/ingest.yml
printmomentum.ingest.enabled=false
printmomentum.ingest.cron=-
printmomentum.ingest.limit=100
printmomentum.ingest.pages-per-sweep=4
printmomentum.ingest.pages-per-query=4
printmomentum.ingest.taxonomy-id=1603
printmomentum.ingest.created-page=false
printmomentum.ingest.review-limit=100
printmomentum.ingest.top-n=100
printmomentum.ingest.min-remaining-today=100
printmomentum.ingest.max-shops-per-run=30
printmomentum.ingest.max-pages-per-shop=4
printmomentum.ingest.pm-bestseller-min-favorers-delta7d=5

printmomentum.bestseller.site-search.enabled=true
printmomentum.bestseller.max-checks-per-run=400
printmomentum.bestseller.max-pages-per-query=4
printmomentum.bestseller.site-base-url=https://www.etsy.com

printmomentum.storage.s3.enabled=false
printmomentum.storage.s3.bucket=${AWS_S3_BUCKET:}
printmomentum.storage.s3.region=${AWS_REGION:eu-central-1}
