spring.datasource.url=jdbc:h2:mem:printmomentum;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT
printmomentum.ingest.enabled=false
printmomentum.ingest.cron=-
printmomentum.bestseller.site-search.enabled=false
